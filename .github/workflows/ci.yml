name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pin the toolchain that produced the deployed wasm (1f30ccf1…). A newer
      # stable emits different wasm bytes for the same source, which would make
      # the "deployed bytecode == this source" proof fail without any code change.
      - name: Install Rust with wasm target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Contract unit tests
        run: npm run test:contract

      - name: Reference model attacks
        run: npm run test:model

      - name: Console regression tests
        run: npm run test:console

      - name: Agent limits, API and u128-precision tests
        run: npm run test:agent

      - name: Build the contract to wasm
        run: |
          # The wasm embeds the absolute cargo registry path, so a byte-identical
          # rebuild must use the CARGO_HOME the deployment was built with. The
          # toolchain is pinned via rust-toolchain.toml. See README "Verification
          # evidence" for the exact values.
          sudo mkdir -p /home/openhands
          sudo chown "$(id -u):$(id -g)" /home/openhands
          CARGO_HOME=/home/openhands/.cargo cargo build --manifest-path contract/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Independent proof (deployed bytecode == this source, pool solvent, on-chain evidence)
        run: npm run verify:proof

      # Runs the COMPILED contract through a real neard node (not the in-process
      # test VM): the full decentralized lifecycle plus the refusals. REQUIRE_SANDBOX
      # makes a missing neard a failure rather than a silent skip.
      - name: Contract end-to-end on a local NEAR node
        env:
          REQUIRE_SANDBOX: "1"
        run: npm run verify:sandbox

      - name: Agent spend-authorization vs the live contract
        run: npm run verify:agent

      - name: Fail if a secret is tracked
        run: |
          if git ls-files | grep -E '(^|/)(identities|state)\.json$|(^|/)keys/'; then
            echo "secret or key material is tracked"; exit 1
          fi
          if git grep -nIE 'ed25519:[0-9A-Za-z]{40,}|BEGIN [A-Z ]*PRIVATE KEY' -- .; then
            echo "a private key was committed"; exit 1
          fi
          echo "no secrets tracked"
