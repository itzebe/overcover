name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the SEC-1 proof can rebuild the deployed v1 source
          # (commit 18ec7f08) and confirm byte-identity to the live module.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pin the toolchain that produced the deployed wasm (1f30ccf1…). A newer
      # stable emits different wasm bytes for the same source, which would make
      # the "deployed bytecode == this source" proof fail without any code change.
      - name: Install Rust with wasm target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Contract unit tests
        run: npm run test:contract

      - name: Reference model attacks
        run: npm run test:model

      - name: Console regression tests
        run: npm run test:console

      - name: Agent limits, API and u128-precision tests
        run: npm run test:agent

      - name: Product feed + agent-evaluation tests
        run: npm run test:agent-eval

      # The discovery agent: deterministic risk rule, evidence-hash reproducibility,
      # a forecast labelled as a forecast (never an observation), and one live read.
      - name: Discovery agent tests
        run: npm run test:factory

      - name: Deploy fail-closed regression (stale wasm refused)
        run: npm run test:deploy

      - name: Build the contract to wasm
        run: |
          # The wasm embeds the absolute cargo registry path, so a byte-identical
          # rebuild must use the CARGO_HOME the deployment was built with. The
          # toolchain is pinned via rust-toolchain.toml. See README "Verification
          # evidence" for the exact values.
          sudo mkdir -p /home/openhands
          sudo chown "$(id -u):$(id -g)" /home/openhands
          CARGO_HOME=/home/openhands/.cargo cargo build --manifest-path contract/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Independent proof (deployed bytecode == this source, pool solvent, on-chain evidence)
        run: npm run verify:proof

      # SEC-1: proves the deployed v1 migrate() takeover and the v2 guard, by
      # byte-identity of the deployed module to the v1 source, the vulnerable
      # shape of v1's migrate(), the guard in v2's, and the Rust guard tests.
      - name: SEC-1 migrate() authorization proof
        run: npm run verify:migration

      # SEC-1 POSITIVE reproduction: deploys the exact live v1 bytecode to a real
      # neard node and shows an unprivileged third party actually taking the
      # contract over (owner + attestor replaced, accounting reset, capital
      # stranded), then shows the hardened v2 module refusing the same call.
      - name: SEC-1 unauthenticated migrate() takeover (positive reproduction)
        env:
          REQUIRE_SANDBOX: "1"
        run: npm run verify:sec1-takeover

      # Runs the COMPILED contract through a real neard node (not the in-process
      # test VM): the full decentralized lifecycle plus the refusals. REQUIRE_SANDBOX
      # makes a missing neard a failure rather than a silent skip.
      - name: Contract end-to-end on a local NEAR node
        env:
          REQUIRE_SANDBOX: "1"
        run: npm run verify:sandbox

      # SEC-1 closure on the COMPILED wasm: a third-party migrate() is refused,
      # the state is untouched, a repeat is refused, and a self-call with no
      # legacy state fails closed.
      - name: SEC-1 migrate() guard on the compiled wasm
        env:
          REQUIRE_SANDBOX: "1"
        run: npm run verify:upgrade

      # The in-place upgrade must PRESERVE live state: runs the exact deployed v1
      # bytecode, deploys v2 over it, self-calls migrate(), and asserts capital,
      # reserved, products and policies survive and the migrated policy settles.
      - name: In-place upgrade preserves state
        env:
          REQUIRE_SANDBOX: "1"
        run: npm run verify:upgrade-preservation

      # The controlled v3 deployment: deploys the COMPILED wasm to a fresh account
      # on a real neard node, configures a 3-of-5 operator quorum and a 3-of-5
      # resolver quorum, and asserts 29 properties against the deployed module
      # (sub-quorum non-finalisation, forged/non-operator refusal, owner/challenger/
      # signer vote exclusion, resolver-quorum decision, third-party migrate()
      # refused, pool solvency). REQUIRE_SANDBOX makes a missing neard a failure.
      - name: Controlled v3 deploy + SEC-1 closure on the deployed module
        env:
          REQUIRE_SANDBOX: "1"
        run: npm run verify:controlled-v3:sandbox

      # The permissionless insurance factory: a NON-OWNER proposal activates a
      # product with no owner transaction, every fixed underwriting rule refuses,
      # the proposer's stake enters the pool, and a buyer purchases cover on the
      # permissionlessly-created product. Runs the COMPILED wasm on a real neard.
      - name: Permissionless factory end-to-end on a local NEAR node
        env:
          REQUIRE_SANDBOX: "1"
        run: npm run verify:factory

      - name: Agent spend-authorization vs the live contract
        run: npm run verify:agent

      - name: Fail if a secret is tracked
        run: |
          if git ls-files | grep -E '(^|/)(identities|state)\.json$|(^|/)keys/'; then
            echo "secret or key material is tracked"; exit 1
          fi
          if git grep -nIE 'ed25519:[0-9A-Za-z]{40,}|BEGIN [A-Z ]*PRIVATE KEY' -- .; then
            echo "a private key was committed"; exit 1
          fi
          echo "no secrets tracked"
