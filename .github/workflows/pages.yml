name: Publish console to the gh-pages branch

# GitHub Pages must be switched on once in repository settings
# (Settings -> Pages -> Deploy from a branch -> gh-pages). The default workflow
# token cannot enable Pages via the API, so this job only publishes the static
# files to a gh-pages branch; it never touches the default branch.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish ui/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ui
          publish_branch: gh-pages
          force_orphan: true
