[package]
name = "overcover-observation-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "OutLayer WASI-P2 adapter: fetch a real observation and normalize it into Overcover's observation schema"

[[bin]]
name = "overcover-observation-adapter"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
